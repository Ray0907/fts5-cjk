name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install sqlite
      - name: build + test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export SQLITE3=sqlite3; fi
          make test
      - name: sanitizers
        run: make asan-test
      - name: static link
        run: make static-test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: build
        shell: bash
        run: |
          gcc -O2 -Wall -shared -static-libgcc -Iinclude -o cjk.dll cjk.c
          objdump -p cjk.dll | grep 'DLL Name'
          ! objdump -p cjk.dll | grep -iE 'DLL Name: (libgcc|libwinpthread)'
      - name: smoke test
        run: python test/smoke.py ./cjk.dll
