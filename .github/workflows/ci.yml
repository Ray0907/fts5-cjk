name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install sqlite
      - name: build + test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export SQLITE_INC=/usr/include SQLITE3=sqlite3; fi
          make test
